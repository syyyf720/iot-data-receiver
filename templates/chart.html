<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>传感器数据趋势</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.0/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
            padding: 30px 30px 10px 30px;
            width: 900px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        #chart {
            width: 100%;
            height: 420px;
        }
        .footer {
            text-align: right;
            font-size: 12px;
            color: #aaa;
            padding-top: 8px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>🌡️ 传感器数据趋势</h2>
    <div id="chart"></div>
    <div class="footer">数据实时更新 · IoT 监控系统</div>
</div>

<script>
    var chartDom = document.getElementById('chart');
    var myChart = echarts.init(chartDom);

    function loadChartData() {
        myChart.showLoading();
        fetch('/api/chart_data')
            .then(res => res.json())
            .then(data => {
                myChart.hideLoading();

                var xData = data.temp.map(item => '第' + item.id + '条');
                var tempData = data.temp.map(item => item.value);
                var humiData = data.humi.map(item => item.value);

                var option = {
                    tooltip: {
                        trigger: 'axis',
                        backgroundColor: 'rgba(255,255,255,0.95)',
                        borderColor: '#ccc',
                        borderWidth: 1,
                        textStyle: { color: '#333' },
                        formatter: function(params) {
                            var res = '<strong>' + params[0].axisValue + '</strong><br/>';
                            params.forEach(function(p) {
                                res += p.marker + ' ' + p.seriesName + '：<strong>' + p.value + '</strong> ℃ / %<br/>';
                            });
                            return res;
                        }
                    },
                    legend: {
                        data: ['温度', '湿度'],
                        top: 0,
                        right: 20,
                        textStyle: { fontSize: 14, fontWeight: 500 }
                    },
                    grid: {
                        left: 60,
                        right: 30,
                        bottom: 30,
                        top: 50
                    },
                    xAxis: {
                        type: 'category',
                        data: xData,
                        axisLine: { lineStyle: { color: '#ccc' } },
                        axisLabel: { fontSize: 12, fontWeight: 500 }
                    },
                    yAxis: [{
                        type: 'value',
                        name: '温度 (℃)',
                        nameTextStyle: { color: '#ff6b6b', fontWeight: 600 },
                        axisLabel: { formatter: '{value} ℃' },
                        splitLine: { lineStyle: { color: '#f0f0f0', type: 'dashed' } }
                    }, {
                        type: 'value',
                        name: '湿度 (%)',
                        nameTextStyle: { color: '#4ecdc4', fontWeight: 600 },
                        axisLabel: { formatter: '{value} %' },
                        splitLine: { show: false }
                    }],
                    series: [{
                        name: '温度',
                        type: 'line',
                        data: tempData,
                        smooth: true,
                        symbol: 'circle',
                        symbolSize: 10,
                        lineStyle: { color: '#ff6b6b', width: 3 },
                        areaStyle: {
                            color: 'rgba(255,107,107,0.15)'
                        },
                        itemStyle: { color: '#ff6b6b' },
                        label: {
                            show: true,
                            formatter: function(p) { return p.value + '℃'; },
                            fontSize: 11,
                            color: '#ff6b6b',
                            fontWeight: 600
                        }
                    }, {
                        name: '湿度',
                        type: 'line',
                        yAxisIndex: 1,
                        data: humiData,
                        smooth: true,
                        symbol: 'diamond',
                        symbolSize: 10,
                        lineStyle: { color: '#4ecdc4', width: 3 },
                        areaStyle: {
                            color: 'rgba(78,205,196,0.15)'
                        },
                        itemStyle: { color: '#4ecdc4' },
                        label: {
                            show: true,
                            formatter: function(p) { return p.value + '%'; },
                            fontSize: 11,
                            color: '#4ecdc4',
                            fontWeight: 600
                        }
                    }]
                };

                myChart.setOption(option);
                window.addEventListener('resize', function() { myChart.resize(); });
            })
            .catch(err => {
                console.error('加载失败:', err);
                myChart.hideLoading();
                document.getElementById('chart').innerHTML = '<p style="text-align:center;color:#999;margin-top:80px;">⚠️ 数据加载失败，请检查后端服务</p>';
            });
    }

    // 页面加载时自动查询
    loadChartData();
</script>
</body>
</html>
